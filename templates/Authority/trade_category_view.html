{% extends 'Authority/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid mt-3">

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">View Trade Category</h5>
        </div>

        <div class="card-body">

            <div id="loadingMessage" class="text-center">
                Loading...
            </div>

            <div id="categoryDetails" class="d-none">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text"
                               id="name"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category Code</label>
                        <input type="text"
                               id="code"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="description"
                                  class="form-control"
                                  rows="4"
                                  readonly></textarea>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <input type="text"
                               id="status"
                               class="form-control"
                               readonly>
                    </div>

                </div>

                <div class="mt-3">
                    <a href="{% url 'trade_categories' %}"
                       class="btn btn-secondary">
                        BACK
                    </a>
                </div>

            </div>

            <div id="errorMessage"
                 class="alert alert-danger d-none">
            </div>

        </div>
    </div>

</div>

<script type="module">
import api from "{% static 'js/api.js' %}";

const loadingMessage = document.getElementById("loadingMessage");
const categoryDetails = document.getElementById("categoryDetails");
const errorMessage = document.getElementById("errorMessage");

const categoryId = "{{ view.kwargs.pk }}";

async function loadCategory() {

    try {

        const category = await api.get(
            `/api/trade-master/categories/${categoryId}/`
        );

        document.getElementById("name").value = category.name || "";
        document.getElementById("code").value = category.code || "";
        document.getElementById("description").value = category.description || "";
        document.getElementById("status").value =
            category.is_active ? "Active" : "Inactive";

        loadingMessage.classList.add("d-none");
        categoryDetails.classList.remove("d-none");

    } catch (error) {

        console.error(error);

        loadingMessage.classList.add("d-none");
        errorMessage.textContent = "Failed to load trade category.";
        errorMessage.classList.remove("d-none");
    }
}

loadCategory();
</script>

{% endblock %}
