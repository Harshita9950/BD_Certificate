{% extends 'Authority/base.html' %}
{% load static %}

{% block title %}Edit District{% endblock %}

{% block content %}
<main class="content">

    <section class="page-inner d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-3">
        <div class="page-heading">
            <h1 class="page-title">Edit District</h1>

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="{% url 'dashboard' %}">
                            Dashboard
                        </a>
                    </li>

                    <li class="breadcrumb-item">
                        <a href="{% url 'district_master' %}">
                            District Master
                        </a>
                    </li>

                    <li class="breadcrumb-item active">
                        Edit District
                    </li>
                </ol>
            </nav>
        </div>
    </section>

    <section class="mb-4">
        <div class="card">
            <div class="card-body p-4">

                <div class="section-heading">
                    <p>
                        Fields marked with
                        <span class="star-required">*</span>
                        are required.
                    </p>
                </div>

                <form id="districtEditForm" novalidate>

                    <div class="row g-4">

                        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                            <label
                                for="districtCode"
                                class="form-label"
                            >
                                District Code
                                <span class="star-required">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="districtCode"
                                name="code"
                                placeholder="Enter district code"
                                required
                            >
                        </div>

                        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                            <label
                                for="districtName"
                                class="form-label"
                            >
                                District Name
                                <span class="star-required">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="districtName"
                                name="name"
                                placeholder="Enter district name"
                                required
                            >
                        </div>

                        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                            <label class="form-label">
                                Status
                                <span class="star-required">*</span>
                            </label>

                            <br>

                            <div class="selectgroup selectgroup-primary selectgroup-pills">

                                <label class="selectgroup-item mb-2">
                                    <input
                                        type="radio"
                                        name="status"
                                        value="active"
                                        class="selectgroup-input"
                                        id="statusActive"
                                        required
                                    >

                                    <span class="selectgroup-button">
                                        Active
                                    </span>
                                </label>

                                <label class="selectgroup-item mb-2">
                                    <input
                                        type="radio"
                                        name="status"
                                        value="inactive"
                                        class="selectgroup-input"
                                        id="statusInactive"
                                    >

                                    <span class="selectgroup-button">
                                        Inactive
                                    </span>
                                </label>

                            </div>
                        </div>

                        <div class="col-12 d-print-none">
                            <p class="text-center pt-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-sm"
                                >
                                    Save
                                </button>

                                <a
                                    href="{% url 'district_master' %}"
                                    class="btn btn-secondary btn-sm"
                                >
                                    Back
                                </a>

                            </p>
                        </div>

                    </div>

                </form>

            </div>
        </div>
    </section>

</main>
{% endblock %}

{% block extra_js %}
<script type="module">
    import api from "{% static 'js/api.js' %}";

    document.addEventListener("DOMContentLoaded", async () => {
        const districtId =
            window.location.pathname
                .split("/")
                .filter(Boolean)
                .pop();

        const form =
            document.getElementById("districtEditForm");

        const codeInput =
            document.getElementById("districtCode");

        const nameInput =
            document.getElementById("districtName");

        const activeInput =
            document.getElementById("statusActive");

        const inactiveInput =
            document.getElementById("statusInactive");

        try {
            const district =
                await api.get(
                    `/api/geography/districts/${districtId}/`
                );

            codeInput.value =
                district.code || "";

            nameInput.value =
                district.name || "";

            if (district.is_active) {
                activeInput.checked = true;
            } else {
                inactiveInput.checked = true;
            }

        } catch (error) {
            alert(
                error.detail ||
                "Unable to load district details."
            );

            window.location.href =
                "{% url 'district_master' %}";

            return;
        }

        form.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                if (!form.checkValidity()) {
                    form.classList.add(
                        "was-validated"
                    );
                    return;
                }

                const selectedStatus =
                    document.querySelector(
                        'input[name="status"]:checked'
                    );

                const payload = {
                    code: codeInput.value.trim(),
                    name: nameInput.value.trim(),
                    is_active:
                        selectedStatus.value === "active"
                };

                const submitButton =
                    form.querySelector(
                        'button[type="submit"]'
                    );

                submitButton.disabled = true;
                submitButton.textContent = "Saving...";

                try {
                    await api.patch(
                        `/api/geography/districts/${districtId}/`,
                        payload
                    );

                    alert(
                        "District updated successfully."
                    );

                    window.location.href =
                        "{% url 'district_master' %}";

                } catch (error) {
                    alert(
                        error.detail ||
                        "Unable to update district."
                    );

                    submitButton.disabled = false;
                    submitButton.textContent = "Save";
                }
            }
        );
    });
</script>
{% endblock %}
