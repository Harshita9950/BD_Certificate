{% extends 'Authority/base.html' %}
{% load static %}

{% block title %}BD Portal{% endblock %}

{% block content %}
<main class="content">

    <section class="page-inner d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-3">
        <div class="page-heading">

            <h1 class="page-title">Add Role</h1>

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">

                    <li class="breadcrumb-item">
                        <a href="{% url 'dashboard' %}">Dashboard</a>
                    </li>

                    <li class="breadcrumb-item">
                        <a href="{% url 'roles' %}">Role Master</a>
                    </li>

                    <li class="breadcrumb-item">
                        Add Role
                    </li>

                </ol>
            </nav>

        </div>
    </section>

    <div class="card border-0 shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">Role Details</h5>
        </div>

        <div class="card-body">

            <form id="roleForm">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Role Name <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            id="roleName"
                            class="form-control"
                            placeholder="Enter role name"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Role Code <span class="text-danger">*</span>
                        </label>

                        <select
                            id="roleCode"
                            class="form-select"
                            required
                        >
                            <option value="">Select Role Code</option>
                            <option value="CITIZEN">Citizen / Applicant</option>
                            <option value="DA">Dealing Assistant</option>
                            <option value="HEALTH_OFFICER">Health Officer</option>
                            <option value="CHO">Chief Health Officer</option>
                            <option value="ACCOUNTANT">Accountant</option>
                            <option value="RI">Revenue Inspector</option>
                            <option value="ZONE_OFFICER">Zone Officer</option>
                            <option value="OFFICER">Licensing Officer</option>
                            <option value="COMMISSIONER">Municipal Commissioner</option>
                            <option value="AUDITOR">Auditor</option>
                            <option value="ADMIN">System Administrator</option>
                        </select>
                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="3"
                            placeholder="Enter role description"
                        ></textarea>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            ULB Code
                        </label>

                        <input
                            type="text"
                            id="ulbCode"
                            class="form-control"
                            placeholder="Leave blank for system-wide role"
                        >

                        <small class="text-secondary">
                            Leave blank for a system-wide role.
                        </small>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label d-block">
                            Status
                        </label>

                        <div class="form-check form-check-inline">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="status"
                                id="statusActive"
                                value="true"
                                checked
                            >

                            <label
                                class="form-check-label"
                                for="statusActive"
                            >
                                Active
                            </label>

                        </div>

                        <div class="form-check form-check-inline">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="status"
                                id="statusInactive"
                                value="false"
                            >

                            <label
                                class="form-check-label"
                                for="statusInactive"
                            >
                                Inactive
                            </label>

                        </div>

                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            Permissions
                        </label>

                        <div
                            id="permissionsContainer"
                            class="border rounded p-3"
                        >
                            <div class="text-secondary">
                                Loading permissions...
                            </div>
                        </div>

                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">

                    <a
                        href="{% url 'roles' %}"
                        class="btn btn-secondary"
                    >
                        BACK
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        SAVE
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>
{% endblock %}

{% block extra_js %}
<script type="module">

    import api from "{% static 'js/api.js' %}";

    document.addEventListener("DOMContentLoaded", async () => {

        const form =
            document.getElementById("roleForm");

        const permissionsContainer =
            document.getElementById("permissionsContainer");

        async function loadPermissions() {

            try {

                const data =
                    await api.get(
                        "/api/users/permissions/"
                    );

                const permissions =
                    data.results || data;

                permissionsContainer.innerHTML = "";

                if (!permissions.length) {

                    permissionsContainer.innerHTML = `
                        <div class="text-secondary">
                            No permissions available.
                        </div>
                    `;

                    return;
                }

                const grouped = {};

                permissions.forEach(permission => {

                    const module =
                        permission.module || "Other";

                    if (!grouped[module]) {
                        grouped[module] = [];
                    }

                    grouped[module].push(permission);
                });

                Object.keys(grouped)
                    .sort()
                    .forEach(module => {

                        const moduleWrapper =
                            document.createElement("div");

                        moduleWrapper.className =
                            "mb-3";

                        moduleWrapper.innerHTML = `
                            <div class="fw-semibold mb-2">
                                ${escapeHtml(module)}
                            </div>
                        `;

                        grouped[module].forEach(
                            permission => {

                                const wrapper =
                                    document.createElement("div");

                                wrapper.className =
                                    "form-check mb-1";

                                wrapper.innerHTML = `
                                    <input
                                        class="form-check-input permission-checkbox"
                                        type="checkbox"
                                        value="${permission.id}"
                                        id="permission_${permission.id}"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="permission_${permission.id}"
                                    >
                                        ${escapeHtml(permission.code)}

                                        ${
                                            permission.description
                                                ? `<span class="text-secondary ms-1">
                                                    - ${escapeHtml(permission.description)}
                                                   </span>`
                                                : ""
                                        }
                                    </label>
                                `;

                                moduleWrapper.appendChild(
                                    wrapper
                                );
                            }
                        );

                        permissionsContainer.appendChild(
                            moduleWrapper
                        );
                    });

            } catch (error) {

                permissionsContainer.innerHTML = `
                    <div class="text-danger">
                        ${escapeHtml(
                            error.detail ||
                            "Unable to load permissions."
                        )}
                    </div>
                `;
            }
        }

        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                const selectedPermissions =
                    Array.from(
                        document.querySelectorAll(
                            ".permission-checkbox:checked"
                        )
                    ).map(
                        checkbox =>
                            Number(checkbox.value)
                    );

                const payload = {

                    name:
                        document
                            .getElementById("roleName")
                            .value
                            .trim(),

                    code:
                        document
                            .getElementById("roleCode")
                            .value,

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim(),

                    permissions:
                        selectedPermissions,

                    ulb_code:
                        document
                            .getElementById("ulbCode")
                            .value
                            .trim(),

                    is_active:
                        document
                            .querySelector(
                                'input[name="status"]:checked'
                            )
                            .value === "true"
                };

                try {

                    await api.post(
                        "/api/users/roles/",
                        payload
                    );

                    alert(
                        "Role created successfully."
                    );

                    window.location.href =
                        "{% url 'roles' %}";

                } catch (error) {

                    let message =
                        error.detail ||
                        "Unable to create role.";

                    if (
                        error.data &&
                        typeof error.data === "object"
                    ) {

                        const errors = [];

                        Object.entries(
                            error.data
                        ).forEach(
                            ([field, value]) => {

                                errors.push(
                                    `${field}: ${Array.isArray(value)
                                        ? value.join(", ")
                                        : value}`
                                );
                            }
                        );

                        if (errors.length) {
                            message =
                                errors.join("\n");
                        }
                    }

                    alert(message);
                }
            }
        );

        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;
        }

        await loadPermissions();

    });

</script>
{% endblock %}
