{% extends 'Authority/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid mt-3">

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Add Trade Category</h5>
        </div>

        <div class="card-body">

            <form id="tradeCategoryForm">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Category Name <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               id="name"
                               class="form-control"
                               maxlength="150"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Category Code <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               id="code"
                               class="form-control"
                               maxlength="20"
                               required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="description"
                                  class="form-control"
                                  rows="4"></textarea>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select id="is_active" class="form-select">
                            <option value="true" selected>Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                </div>

                <div id="formError"
                     class="alert alert-danger d-none">
                </div>

                <div class="mt-3">
                    <button type="submit"
                            class="btn btn-primary">
                        SAVE
                    </button>

                    <a href="{% url 'trade_categories' %}"
                       class="btn btn-secondary">
                        CANCEL
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<script type="module">
import api from "{% static 'js/api.js' %}";

const form = document.getElementById("tradeCategoryForm");
const formError = document.getElementById("formError");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    formError.classList.add("d-none");
    formError.textContent = "";

    const payload = {
        name: document.getElementById("name").value.trim(),
        code: document.getElementById("code").value.trim(),
        description: document.getElementById("description").value.trim(),
        is_active: document.getElementById("is_active").value === "true"
    };

    try {

        await api.post(
            "/api/trade-master/categories/",
            payload
        );

        alert("Trade category created successfully.");

        window.location.href = "{% url 'trade_categories' %}";

    } catch (error) {

        console.error(error);

        let message = "Failed to create trade category.";

        if (error.data) {

            if (typeof error.data === "object") {
                message = Object.entries(error.data)
                    .map(([field, value]) => {
                        const text = Array.isArray(value)
                            ? value.join(", ")
                            : String(value);

                        return `${field}: ${text}`;
                    })
                    .join("\n");
            }
        } else if (error.detail) {
            message = error.detail;
        }

        formError.textContent = message;
        formError.classList.remove("d-none");
    }
});
</script>

{% endblock %}
